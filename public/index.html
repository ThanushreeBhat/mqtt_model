<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>ESP32 Sensor Dashboard</h1>

    <div class="container">
        <div class="card">
            <h2>Temperature</h2>
            <p id="temperature">-- °C</p>
        </div>

        <div class="card">
            <h2>Humidity</h2>
            <p id="humidity">-- %</p>
        </div>
    </div>

    <p id="status">Waiting for sensor data...</p>

    <script src="script.js"></script>
</body>
</html>
